<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Probador de bot de turnos</title>
<style>
  :root { --bg: #e5ddd5; --bubble-bot: #fff; --bubble-user: #d9fdd3; --accent: #075e54; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f0f2f5; }
  .top { background: var(--accent); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .top select { margin-left: auto; padding: 6px; border-radius: 6px; border: none; }
  .wrap { max-width: 480px; margin: 20px auto; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.2); background: #fff; }
  .chat { background: var(--bg); height: 520px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bubble-bot); border-top-left-radius: 0; }
  .user { align-self: flex-end; background: var(--bubble-user); border-top-right-radius: 0; }
  .inputRow { display: flex; padding: 10px; gap: 8px; background: #fff; border-top: 1px solid #ddd; }
  .inputRow input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
  .inputRow button { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
  .hint { font-size: 12px; color: #666; padding: 6px 14px; }
</style>
</head>
<body>
  <div class="top">
    <strong>🤖 Probador de bot</strong>
    <select id="businessSelect"></select>
  </div>
  <div class="wrap">
    <div class="chat" id="chat"></div>
    <div class="hint">Tip: escribí "turno" para arrancar, "cancelar" para cancelar el último, "hablar con alguien" para derivar a humano.</div>
    <div class="inputRow">
      <input id="input" placeholder="Escribí un mensaje..." />
      <button id="send">➤</button>
    </div>
  </div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const businessSelect = document.getElementById("businessSelect");

// customerId simulado, fijo por sesión de prueba (simula el número de WhatsApp del cliente)
const customerId = "demo-" + Math.random().toString(36).slice(2, 8);

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadBusinesses() {
  const res = await fetch("/api/businesses");
  const list = await res.json();
  businessSelect.innerHTML = list
    .map((b) => `<option value="${b.businessId}">${b.displayName}</option>`)
    .join("");
}

async function sendMessage(text) {
  addMessage(text, "user");
  inputEl.value = "";
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      businessId: businessSelect.value,
      customerId,
      customerName: "Lucas (prueba)",
      message: text,
    }),
  });
  const data = await res.json();
  addMessage(data.reply, "bot");
}

sendBtn.addEventListener("click", () => {
  if (inputEl.value.trim()) sendMessage(inputEl.value.trim());
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && inputEl.value.trim()) sendMessage(inputEl.value.trim());
});

loadBusinesses().then(() => sendMessage("hola"));
</script>
</body>
</html>
